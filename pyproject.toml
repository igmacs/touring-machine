[project]
name = "touring-machine"
version = "0.1.0"
description = "Playlist generator for upcoming concerts"
authors = [
    { name = "Ignacio Casso", email = "ignacio.casso@mailbox.org" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "rapidfuzz>=3.0.0",
    "tidalapi>=0.7.6",
    "typer>=0.12.0",
]

[project.scripts]
touring-machine = "touring_machine.cli:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
